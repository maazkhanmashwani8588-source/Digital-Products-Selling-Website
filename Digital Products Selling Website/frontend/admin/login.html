<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Digital Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 400px;
            width: 100%;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h2 {
            color: #667eea;
            font-weight: bold;
        }
        .login-header p {
            color: #6c757d;
            margin-top: 5px;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 10px;
            font-weight: 500;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #5568d3 0%, #653a91 100%);
            color: white;
        }
        .error-message {
            display: none;
            padding: 12px;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 5px;
            color: #721c24;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2><i class="bi bi-speedometer2"></i> Digital Hub</h2>
            <p>Admin Dashboard Login</p>
        </div>

        <div class="error-message" id="error"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-login btn-primary w-100">
                <i class="bi bi-box-arrow-in-right"></i> Login
            </button>
        </form>

        <hr class="my-4">

        <p class="text-center text-muted small mb-0">
            Back to <a href="/frontend/auth/login.html" class="text-decoration-none">user login</a>
        </p>
    </div>

   <script>
    // Check if already logged in as admin
    const user = JSON.parse(sessionStorage.getItem('user') || '{}');

    if (user.role === 'admin') {
        window.location.href = 'index.html';
    }

    async function handleLogin(event) {
        event.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorEl = document.getElementById('error');

        errorEl.style.display = 'none';

        try {
            const response = await fetch('../../backend/endpoints/auth_login.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'same-origin',
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            });

            const data = await response.json();

            if (data.success) {

                if (data.user.role === 'admin') {

                    sessionStorage.setItem('user', JSON.stringify(data.user));
                    sessionStorage.setItem('admin_logged_in', 'true');

                    window.location.href = 'index.html';

                } else {

                    errorEl.textContent =
                        'Admin access required. Please use an admin account.';
                    errorEl.style.display = 'block';

                }

            } else {

                errorEl.textContent =
                    data.error || 'Login failed';
                errorEl.style.display = 'block';

            }

        } catch (error) {

            console.error(error);

            errorEl.textContent =
                'Connection error. Unable to reach the server.';
            errorEl.style.display = 'block';

        }
    }
</script>
</body>
</html>
