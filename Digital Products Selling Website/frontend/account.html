<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account — Digital Hub</title><link rel="stylesheet" href="css/style.css"></head>
<body>
  <header class="container nav"><div class="brand">Digital Hub</div></header>
  <main class="container">

    <section class="card">

    <section class="card" style="margin-top:12px"><h3>Security</h3><label>New password<input type="password"></label></section>
  </main>
</body></html>
