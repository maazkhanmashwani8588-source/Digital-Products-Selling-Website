<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Products</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div class="container py-4"><h1 class="h4">Admin - Products</h1><div id="productsArea"></div><hr><h5>Create / Edit Product</h5><form id="productForm"><input type="hidden" name="id"><div class="row"><div class="col-md-6 mb-2"><input name="title" class="form-control" placeholder="Title"></div><div class="col-md-6 mb-2"><input name="slug" class="form-control" placeholder="Slug"></div></div><div class="mb-2"><input name="short_description" class="form-control" placeholder="Short description"></div><div class="mb-2"><input name="price" class="form-control" placeholder="Price"></div><div class="mb-2"><input name="file_path" class="form-control" placeholder="File path (relative)"></div><div><button class="btn btn-primary">Save</button></div></form></div>
<script>
async function load(){ const res = await fetch('/backend/endpoints/admin_products_list.php'); if(!res.ok){ document.getElementById('productsArea').innerHTML='<div class="alert alert-danger">Admin only</div>'; return; } const json = await res.json(); let html=''; json.products.forEach(p=>{ html += `<div class="card mb-2"><div class="card-body d-flex justify-content-between"><div><strong>${p.title}</strong><div class="text-muted">${p.slug}</div></div><div><button class="btn btn-sm btn-outline-secondary" onclick="edit(${p.id})">Edit</button></div></div></div>` }); document.getElementById('productsArea').innerHTML = html; }
function edit(id){ fetch('/backend/endpoints/product_detail.php?id='+id).then(r=>r.json()).then(j=>{ const p=j.product; const f=document.getElementById('productForm'); f.id.value=p.id; f.title.value=p.title; f.slug.value=p.slug; f.short_description.value=p.short_description; f.price.value=p.price; f.file_path.value=p.file_path; }); }
document.getElementById('productForm').addEventListener('submit', async e=>{ e.preventDefault(); const fd=new FormData(e.target); const obj={}; for(const [k,v] of fd.entries()) if(v) obj[k]=v; const res=await fetch('/backend/endpoints/admin_product_save.php',{method:'POST',body:JSON.stringify(obj),headers:{'Content-Type':'application/json'}}).then(r=>r.json()); if(res.success) { alert('Saved'); load(); } else alert('Failed'); });
load();
</script></body></html>
