<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart — Digital Hub</title><link rel="stylesheet" href="css/style.css"></head>
<body>
  <header class="container nav"><div class="brand">Digital Hub</div><nav class="row muted"><a href="products.html">Products</a></nav></header>
  <main class="container py-4">
    <h1>Your Cart</h1>
    <div id="cartList"></div>
    <div class="card mt-3">
      <div class="card-body d-flex justify-content-between align-items-center">
        <div>
          <input id="coupon" placeholder="Coupon code" class="form-control">
        </div>
        <div><button class="btn btn-primary" id="checkoutBtn">Checkout</button></div>
      </div>
    </div>
  </main>
  <script>
    async function loadCart(){
      const res = await fetch('../backend/endpoints/cart_get.php').then(r=>r.json());
      const cart = res.cart || [];
      const list = document.getElementById('cartList');
      if(!cart.length){ list.innerHTML = '<div class="card"><div class="card-body text-muted">Cart is empty</div></div>'; return; }
      // fetch product details for each
      const ids = cart.map(i=>i.product_id).join(',');
      // naive: fetch each product
      let rows = '';
      for(const it of cart){ const pRes = await fetch('../backend/endpoints/product_detail.php?id='+it.product_id).then(r=>r.json()); const p = pRes.product; rows += `<div class="card mb-2"><div class="card-body d-flex justify-content-between align-items-center"><div><strong>${p.title}</strong><div class="text-muted">${p.short_description||''}</div></div><div>${it.quantity} × $${Number(p.sale_price||p.price).toFixed(2)} <button class="btn btn-sm btn-outline-danger ms-2" onclick="remove(${p.id})">Remove</button></div></div></div>`; }
      list.innerHTML = rows;
    }
    async function remove(id){ await fetch('../backend/endpoints/cart_remove.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product_id:id})}); loadCart(); }
    document.getElementById('checkoutBtn').addEventListener('click', ()=> location.href='checkout.html');
    loadCart();
  </script>
  <script>
    // render cart
    const cartList = document.getElementById('cartList');
    const items = JSON.parse(localStorage.getItem('dh_cart')||'[]');
    if(items.length===0){cartList.innerHTML='<p class="muted">Cart is empty</p>'}
    else{cartList.innerHTML=items.map(i=>`<div class='row' style='justify-content:space-between'><div>Item ${i.id}</div><div>${i.qty} × $9.99 <button onclick="(function(){const arr=JSON.parse(localStorage.getItem('dh_cart')||'[]').filter(x=>x.id!=${i.id});localStorage.setItem('dh_cart',JSON.stringify(arr));location.reload()})()">Remove</button></div></div>`).join('')}
  </script>
</body>
</html>
