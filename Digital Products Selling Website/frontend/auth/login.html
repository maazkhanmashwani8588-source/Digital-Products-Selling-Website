<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login — Digital Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-body">
              <h3 class="card-title mb-3">Sign In</h3>
              <form id="loginForm">
                <div class="mb-3"><label class="form-label">Email</label><input name="email" type="email" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required></div>
                <div class="d-flex justify-content-between align-items-center">
                  <a href="/frontend/auth/forgot-password.html">Forgot?</a>
                  <button class="btn btn-primary">Sign In</button>
                </div>
              </form>
              <hr>
              <div class="text-center">Don't have an account? <a href="/frontend/auth/register.html">Sign up</a></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      document.getElementById('loginForm').addEventListener('submit', async e=>{
        e.preventDefault();
        const fd = new FormData(e.target); const payload = { email: fd.get('email'), password: fd.get('password') };
        const res = await fetch('/backend/endpoints/auth_login.php', { method:'POST', body: JSON.stringify(payload), headers: {'Content-Type':'application/json'} });
        const json = await res.json();
        if (res.ok) { window.location='/frontend/products.html'; } else { alert(json.error || 'Login failed'); }
      })
    </script>
  </body>
</html>
