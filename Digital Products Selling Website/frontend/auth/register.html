<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Register — Digital Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow-sm">
            <div class="card-body">
              <h3 class="card-title mb-3">Create account</h3>
              <form id="registerForm">
                <div class="mb-3"><label class="form-label">Full name</label><input name="name" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">Email</label><input name="email" type="email" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" class="form-control" minlength="8" required></div>
                <div class="d-flex justify-content-end"><button class="btn btn-primary">Register</button></div>
              </form>
              <hr>
              <div class="text-center">Already have an account? <a href="/frontend/auth/login.html">Sign in</a></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      document.getElementById('registerForm').addEventListener('submit', async e=>{
        e.preventDefault();
        const fd = new FormData(e.target); const payload = { name: fd.get('name'), email: fd.get('email'), password: fd.get('password') };
        const res = await fetch('/backend/endpoints/auth_register.php', { method:'POST', body: JSON.stringify(payload), headers: {'Content-Type':'application/json'} });
        const json = await res.json();
        if (res.ok) { window.location='/frontend/products.html'; } else { alert(json.error || 'Registration failed'); }
      })
    </script>
  </body>
</html>
