<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div class="container py-5"><div class="row justify-content-center"><div class="col-md-6"><div class="card shadow-sm"><div class="card-body"><h3>Reset Password</h3><form id="resetForm"><input type="hidden" name="token" id="tokenInput"><div class="mb-3"><label class="form-label">New password</label><input name="password" type="password" class="form-control" minlength="8" required></div><div class="d-flex justify-content-end"><button class="btn btn-primary">Reset password</button></div></form><div id="msg" class="mt-3"></div></div></div></div></div></div>
<script>
const params = new URLSearchParams(window.location.search); const token = params.get('token'); if(token){ document.getElementById('tokenInput').value = token; }
document.getElementById('resetForm').addEventListener('submit', async e=>{
  e.preventDefault(); const fd=new FormData(e.target); const payload = { token: fd.get('token'), password: fd.get('password') };
  const res = await fetch('/backend/endpoints/reset-password.php',{method:'POST',body:JSON.stringify(payload),headers:{'Content-Type':'application/json'}});
  const json = await res.json();
  if(res.ok) { document.getElementById('msg').innerHTML = '<div class="alert alert-success">Password reset. You may now <a href="/frontend/auth/login.html">login</a>.</div>'; } else { document.getElementById('msg').innerHTML = '<div class="alert alert-danger">'+(json.error||'Failed')+'</div>'; }
});
</script></body></html>
