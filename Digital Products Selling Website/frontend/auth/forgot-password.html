<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div class="container py-5"><div class="row justify-content-center"><div class="col-md-6"><div class="card shadow-sm"><div class="card-body"><h3>Forgot Password</h3><form id="forgotForm"><div class="mb-3"><label class="form-label">Email</label><input name="email" type="email" class="form-control" required></div><div class="d-flex justify-content-end"><button class="btn btn-primary">Send reset link</button></div></form><div id="linkArea" class="mt-3"></div></div></div></div></div></div>
<script>
document.getElementById('forgotForm').addEventListener('submit', async e=>{
  e.preventDefault(); const fd=new FormData(e.target);
  const res=await fetch('/backend/endpoints/forgot-password.php',{method:'POST',body:JSON.stringify({email:fd.get('email')}),headers:{'Content-Type':'application/json'}});
  const json=await res.json();
  if(res.ok){ document.getElementById('linkArea').innerHTML = '<div class="alert alert-success">Reset link (demo): <a href="'+json.reset_link+'">Open reset link</a></div>'; } else { alert(json.error||'Failed'); }
})
</script></body></html>
