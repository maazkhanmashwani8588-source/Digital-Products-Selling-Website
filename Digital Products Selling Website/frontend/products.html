<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Products — Digital Hub</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script defer src="js/app.js"></script>
</head>
<body>
  <header class="container nav"><div class="brand">Digital Hub</div><nav class="row muted"><a href="cart.html">Cart</a></nav></header>
  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3">Products</h1>
      <div class="d-flex gap-2">
        <input id="searchInput" class="form-control" placeholder="Search products" style="min-width:220px">
        <select id="categorySelect" class="form-select" style="width:180px"><option value="">All categories</option></select>
      </div>
    </div>

    <div class="mb-3"><h5>Featured</h5><div id="featuredRow" class="d-flex gap-3 overflow-auto"></div></div>

    <div id="productsGrid" class="row g-3"></div>
    <nav id="paginationNav" class="mt-3"></nav>
  </main>
  <footer class="container muted" style="margin-top:28px;padding:24px 0">© Digital Hub</footer>

 <script>
async function fetchCategories(){
  try {
    const res = await fetch('/backend/endpoints/categories_list.php');
    const data = await res.json();

    const sel = document.getElementById('categorySelect');
    sel.innerHTML = `<option value="">All categories</option>`;

    (data.categories || []).forEach(c=>{
      const opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = c.name;
      sel.appendChild(opt);
    });

  } catch (err) {
    console.error("Category load failed", err);
  }
}

function renderProducts(data){
  const grid = document.getElementById('productsGrid');
  grid.innerHTML = '';

  (data.products || []).forEach(p=>{
    const price = Number(p.sale_price || p.price || 0);

    const col = document.createElement('div');
    col.className = 'col-12 col-sm-6 col-md-4 col-lg-3';

    col.innerHTML = `
      <div class="card h-100">
        <img src="${p.thumbnail || '/frontend/assets/placeholder.png'}" class="card-img-top">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">${p.title || ''}</h5>
          <p class="card-text text-muted">${p.short_description || ''}</p>

          <div class="mt-auto d-flex justify-content-between align-items-center">
            <div class="text-primary fw-bold">
              $${price.toFixed(2)}
            </div>
            <a class="btn btn-sm btn-primary" href="/frontend/product.html?id=${p.id}">
              View
            </a>
          </div>
        </div>
      </div>
    `;
    grid.appendChild(col);
  });

  // pagination
  const nav = document.getElementById('paginationNav');
  nav.innerHTML = '';

  const total = data.total || 0;
  const per = data.per_page || 12;
  const page = data.page || 1;
  const pages = Math.ceil(total / per);

  if (pages > 1) {
    const ul = document.createElement('ul');
    ul.className = 'pagination';

    for (let i = 1; i <= pages; i++) {
      const li = document.createElement('li');
      li.className = 'page-item' + (i === page ? ' active' : '');

      li.innerHTML = `<a class="page-link" href="#">${i}</a>`;
      li.addEventListener('click', (e) => {
        e.preventDefault();
        load({ page: i });
      });

      ul.appendChild(li);
    }

    nav.appendChild(ul);
  }
}

async function load(opts = {}) {
  try {
    const q = document.getElementById('searchInput').value || '';
    const cat = document.getElementById('categorySelect').value || '';
    const page = opts.page || 1;

    const res = await fetch(`/backend/endpoints/products_list.php?q=${encodeURIComponent(q)}&category=${encodeURIComponent(cat)}&page=${page}`);

    const data = await res.json();

    if (!data.success) {
      throw new Error(data.error || 'API failed');
    }

    // featured
    const featRow = document.getElementById('featuredRow');
    featRow.innerHTML = '';

    (data.products || [])
      .filter(p => p.featured == 1)
      .slice(0, 6)
      .forEach(p => {
        const div = document.createElement('div');
        div.style.minWidth = '200px';
        div.innerHTML = `
          <div class="card">
            <img src="${p.thumbnail || '/frontend/assets/placeholder.png'}" class="card-img-top">
            <div class="card-body">
              <h6 class="card-title">${p.title}</h6>
            </div>
          </div>
        `;
        featRow.appendChild(div);
      });

    renderProducts(data);

  } catch (err) {
    console.error("Load failed:", err);
    alert("Failed to load products. Check backend API.");
  }
}

// events
document.getElementById('searchInput').addEventListener('input', () => load({ page: 1 }));
document.getElementById('categorySelect').addEventListener('change', () => load({ page: 1 }));

// init
fetchCategories().then(() => load());
</script>
</body>
</html>
